id: "de.nucleus.foss_warn"
runtime: "org.freedesktop.Platform"
runtime-version: "24.08"
sdk: "org.freedesktop.Sdk"
sdk-extensions:
  - "org.freedesktop.Sdk.Extension.llvm19"
command: "foss_warn"
finish-args:
  - "--share=ipc"
  - "--socket=fallback-x11"
  - "--socket=wayland"
  - "--device=dri"
  - "--share=network"
cleanup-commands:
  - "rm -r /var/lib/*"
modules:
  - name: "foss_warn"
    buildsystem: "simple"
    build-options:
      build-args:
        - "--share=network"
      arch:
        x86_64:
          env:
            BUNDLE_PATH: "/run/build/foss_warn/build/linux/x64/release/bundle"
        aarch64:
          env:
            BUNDLE_PATH: "/run/build/foss_warn/build/linux/arm64/release/bundle"
      append-path: "/usr/lib/sdk/llvm19/bin:/run/build/foss_warn/flutter/bin"
      prepend-ld-library-path: "/usr/lib/sdk/llvm19/lib"
      env:
        PUB_CACHE: "/run/build/foss_warn/.pub-cache"
    build-commands:
      - "flutter pub get"
      - "flutter gen-l10n"
      - "flutter build linux --release"
      - "install -D $BUNDLE_PATH/foss_warn /app/bin/foss_warn"
      - "cp -r $BUNDLE_PATH/lib /app/bin/lib"
      - "cp -r $BUNDLE_PATH/data /app/bin/data"
    sources:
      - type: "git"
        url: "https://github.com/PureTryOut/foss_warn"
        branch: "feat/linux-support"
      - type: "git"
        url: "https://github.com/flutter/flutter.git"
        tag: "3.29.2"
        dest: "flutter"

